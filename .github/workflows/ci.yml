name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          # rustfmt / clippy 只在 macOS 的 Format、Clippy 两步用到
          components: ${{ runner.os == 'macOS' && 'rustfmt, clippy' || '' }}
          # 该 action 默认注入 RUSTFLAGS=-D warnings，会让 build/test 也把警告当错误；
          # warnings-as-errors 交给显式的 Clippy 步骤承担
          rustflags: ""

      # gpui on Linux needs Wayland / X11 / xkbcommon / fontconfig headers and a Vulkan loader
      # (same list as gpui-component's script/install-linux.sh, minus webkit which we do not use)
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev \
            libvulkan1 vulkan-validationlayers

      - name: Format
        if: runner.os == 'macOS'
        run: cargo fmt --all -- --check

      # 发布用的打包脚本只在打 tag 时真正运行；这里先把语法错误挡在 PR 阶段
      - name: Shell scripts
        if: runner.os == 'Linux'
        run: |
          bash -n scripts/*.sh scripts/ci/*.sh
          shellcheck -S warning scripts/*.sh scripts/ci/*.sh
          python3 -m py_compile scripts/*.py

      - name: Clippy
        if: runner.os == 'macOS'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

  licenses:
    name: Licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 依赖许可证门禁：拦截混入依赖图的 copyleft 许可证。
      # 规则与已知例外见仓库根目录的 deny.toml。
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
