<!-- GetCat logo：被抓娃娃机从腰上拎起来的胖橘猫。
     只画猫与爪子（透明底），超椭圆底板由 scripts/gen-logo.py 合成。
     色值按深色夜蓝底板（#1A2540）配。
     坐标系是 512×512 的底板；吊绳从 y<0 伸出，合成时被底板裁掉。
     ≤ 32 px 用的简化版：去掉脸部细节与条纹，吊绳、爪子、四肢加粗。
     爪子与吊绳按角色标了 class，配色由 scripts/gen-logo.py 按浅 / 深两张色表注入：
       cable 吊绳（描边）· metal 爪子主体（填充）· metal-line 爪齿（描边）· metal-shade 爪子暗部（填充）
     元素上写的色值是深色稿的取值，单独打开 SVG 时看到的就是深色版。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
