  app_menu_entry:
    en: Add to application menu
    zh-CN: 加入应用菜单
    zh-TW: 加入應用程式選單
    ja: アプリケーションメニューに追加
    fr: Ajouter au menu des applications
  app_menu_entry_desc:
    en: Writes a launcher and icon under ~/.local/share so GetCat shows up in the app grid and the dock. It points at this executable, so move the file first and re-enable if you relocate it. Turn off to remove.
    zh-CN: 在 ~/.local/share 下写入启动项与图标，GetCat 会出现在应用列表和 Dock 中。启动项指向当前可执行文件，挪动文件后需重新打开一次；关闭即删除。
    zh-TW: 在 ~/.local/share 下寫入啟動項目與圖示，GetCat 會出現在應用程式列表和 Dock 中。啟動項目指向目前的執行檔，移動檔案後需重新開啟一次；關閉即刪除。
    ja: ~/.local/share にランチャーとアイコンを書き込み、GetCat がアプリ一覧と Dock に表示されるようになります。現在の実行ファイルを指すため、ファイルを移動したら再度オンにしてください。オフにすると削除されます。
    fr: "Écrit un lanceur et une icône dans ~/.local/share pour que GetCat apparaisse dans la grille d’applications et le dock. Le lanceur pointe vers cet exécutable : si vous le déplacez, réactivez l’option. Désactivez-la pour le supprimer."
  language_desc:
    en: Follow system picks from your preferred languages and falls back to English
    zh-CN: 跟随系统按系统首选语言选择，没有匹配的语言时使用英文
    zh-TW: 跟隨系統會按系統偏好語言選擇，沒有相符的語言時使用英文
    ja: 「システムに従う」はシステムの優先言語から選び、一致する言語がなければ英語になります
    fr: « Suivre le système » choisit parmi vos langues préférées et utilise l’anglais à défaut
  editor_font_size:
    en: Editor font size
    zh-CN: 编辑器字号
    zh-TW: 編輯器字級
    ja: エディタのフォントサイズ
    fr: Taille de police de l’éditeur
  editor_font_size_desc:
    en: Monospace size for the request body and response (px)
    zh-CN: 请求 Body 与响应正文使用的等宽字号（px）
    zh-TW: 請求 Body 與回應內文使用的等寬字級（px）
    ja: リクエストボディとレスポンス本文に使う等幅フォントのサイズ（px）
    fr: Taille de la police à chasse fixe du corps de la requête et de la réponse (px)
  timeout:
    en: Timeout
    zh-CN: 超时
    zh-TW: 逾時
    ja: タイムアウト
    fr: Délai d’expiration
  timeout_total:
    en: Total timeout (s)
    zh-CN: 总超时（秒）
    zh-TW: 總逾時（秒）
    ja: 合計タイムアウト（秒）
    fr: Délai total (s)
  timeout_desc:
    en: Upper bound from connect to the last byte; 0 means unlimited. The connect timeout is fixed at 10 s
    zh-CN: 从连接到读完响应的总时长上限；0 表示不限。连接超时固定 10 秒
    zh-TW: 從連線到讀完回應的總時長上限；0 表示不限。連線逾時固定 10 秒
    ja: 接続から最後のバイトを受信するまでの上限です。0 は無制限。接続タイムアウトは 10 秒固定です
    fr: Durée maximale de la connexion jusqu’au dernier octet ; 0 signifie illimité. Le délai de connexion est fixé à 10 s
  redirects:
    en: Redirects
    zh-CN: 跳转
    zh-TW: 重新導向
    ja: リダイレクト
    fr: Redirections
  follow_redirects:
    en: Follow 3xx redirects
    zh-CN: 自动跟随 3xx 跳转
    zh-TW: 自動跟隨 3xx 重新導向
    ja: 3xx リダイレクトに従う
    fr: Suivre les redirections 3xx
  follow_redirects_desc:
    en: When off, 301 / 302 responses are shown as-is
    zh-CN: 关闭后直接显示 301 / 302 等响应本身
    zh-TW: 關閉後直接顯示 301 / 302 等回應本身
    ja: オフにすると 301 / 302 などのレスポンスをそのまま表示します
    fr: Si désactivé, les réponses 301 / 302 sont affichées telles quelles
  max_redirects:
    en: Maximum redirects
    zh-CN: 最大跳转次数
    zh-TW: 最多重新導向次數
    ja: 最大リダイレクト回数
    fr: Nombre maximal de redirections
  security:
    en: Security
    zh-CN: 安全
    zh-TW: 安全性
    ja: セキュリティ
    fr: Sécurité
  verify_tls:
    en: Verify TLS certificates
    zh-CN: 校验 TLS 证书
    zh-TW: 驗證 TLS 憑證
    ja: TLS 証明書を検証する
    fr: Vérifier les certificats TLS
  verify_tls_desc:
    en: On by default — a bad certificate aborts the handshake. Turn it off to debug local self-signed endpoints; certificate problems are still detected and shown in the response's Certificate tab.
    zh-CN: 默认打开，遇到坏证书直接握手失败。调试本地自签名接口时可关闭；关闭后依然会检测证书问题并在响应的「证书」页签里展示。
    zh-TW: 預設開啟，遇到有問題的憑證會直接交握失敗。除錯本機自我簽署的介面時可關閉；關閉後仍會偵測憑證問題，並在回應的「憑證」頁籤裡顯示。
    ja: デフォルトはオンで、不正な証明書ではハンドシェイクが失敗します。ローカルの自己署名エンドポイントをデバッグするときはオフにできます。オフでも証明書の問題は検出され、レスポンスの「証明書」タブに表示されます。
    fr: "Activé par défaut : un certificat invalide fait échouer la négociation. Désactivez-le pour déboguer des services locaux auto-signés ; les problèmes de certificat restent détectés et affichés dans l’onglet Certificat de la réponse."
  storage:
    en: Storage
    zh-CN: 存储位置
    zh-TW: 儲存位置
    ja: 保存場所
    fr: Stockage
  storage_desc:
    en: Saved requests, drafts and settings live here as JSON files; back them up or manage them with Git
    zh-CN: 已保存请求、草稿与设置都以 JSON 文件形式放在这里，可直接备份或用 Git 管理
    zh-TW: 已儲存的請求、草稿與設定都以 JSON 檔案形式放在這裡，可直接備份或用 Git 管理
    ja: 保存済みリクエスト、下書き、設定はここに JSON ファイルとして置かれます。そのままバックアップしたり Git で管理したりできます
    fr: Les requêtes enregistrées, les brouillons et les paramètres sont stockés ici sous forme de fichiers JSON ; sauvegardez-les ou gérez-les avec Git
  data_dir:
    en: Data directory
    zh-CN: 数据目录
    zh-TW: 資料目錄
    ja: データディレクトリ
    fr: Dossier de données
  data_dir_unavailable:
    en: (storage unavailable)
    zh-CN: （持久化不可用）
    zh-TW: （儲存空間無法使用）
    ja: （ストレージを利用できません）
    fr: (stockage indisponible)
